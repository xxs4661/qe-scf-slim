name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and CLI tests
        run: |
          python -m pip install ".[dev,probe]"
          python -m pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run the offline wheel without third-party packages
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/offline"
          "$RUNNER_TEMP/offline/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          offline/bin/scf-slim diagnose "$GITHUB_WORKSPACE/examples/si-converged.out" --check
          offline/bin/scf-slim compare "$GITHUB_WORKSPACE"/examples/*.out --json > batch.json
          python -c 'import json; assert json.load(open("batch.json"))["counts"] == {"converged": 1, "unconverged": 1}'
