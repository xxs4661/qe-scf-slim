[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qe-scf-slim"
dynamic = ["version"]
description = "Triage Quantum ESPRESSO SCF jobs with line-numbered evidence and targeted next actions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hong Zhihan" }
]
keywords = ["quantum-espresso", "scf", "mixing-beta", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
probe = ["PyYAML>=6.0", "matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
]

[project.scripts]
scf-slim = "scfopt.cli:main"

[project.urls]
Repository = "https://github.com/xxs4661/qe-scf-slim"

[tool.setuptools.dynamic]
version = { attr = "scfopt.__version__" }

[tool.setuptools]
package-dir = { "" = "scripts/scf_slim" }
py-modules = ["run_scf", "parser"]

[tool.setuptools.packages.find]
where = ["scripts/scf_slim"]
include = ["scfopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/scf_slim"]
